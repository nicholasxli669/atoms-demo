[project]
name = "atoms-agent"
version = "0.1.0"
description = "Atoms Studio 的 Agent 服务：规划 → 生成 → 静态校验 → 自动修复 → 截断续写"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
